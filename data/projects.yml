    featured: true
    order: 7
    cv_order: 7
    github_readme_order: 4
    number: "04"
    symbol: "↗"
    eyebrow: Institutional AI infrastructure
    github: https://github.com/gt-ospo/gt-dare-deploy
    tags_card: "Django · React · Podman · Linux"
    blurb_card: "Deployment, operations, and access/onboarding workflow development for Georgia Tech’s deployment of the open-source DARE research platform."
    blurb_cv: "Deployment and research software engineering through Georgia Tech OSPO: Podman/systemd services, operations documentation, and Django/React access-request and administrator-approval workflows."
    blurb_github: "institutional deployment and research software engineering for DARE through Georgia Tech OSPO."
    detail_html: >-
      DARE (Dietrich Analysis Research Education) is an open-source research and conversation platform with multiple language-model providers, document-grounded retrieval, and tool integrations. Through Georgia Tech OSPO, I contribute to its institutional deployment and operation.</p><ul class="record-list"><li><strong>Deployment and operations:</strong> containerized services using Podman and systemd Quadlet, with installation and administration guidance.</li><li><strong>Access and onboarding:</strong> access-request, email-notification, and administrator-approval workflow development across the Django backend and React frontend.</li><li><strong>Deployment readiness:</strong> configuration checks, reverse-proxy routing, and rollout and rollback documentation.</li></ul><p class="work-status">Recent onboarding changes are prepared and locally tested; live email delivery and production rollout remain pending.</p><p>My contributions build on the upstream DARE platform. <a href="https://github.com/gt-ospo/gt-dare-backend">Backend repository ↗</a> · <a href="https://github.com/gt-ospo/gt-dare-frontend">Frontend repository ↗</a>
    show_in_github_readme: true
