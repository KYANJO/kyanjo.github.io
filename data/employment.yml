# Canonical employment/appointment history.
# Edit this file when: you start/end a job, change title/unit, or the OSPO
# arrangement or effort split changes.
#
# Fields:
#   id            stable slug, used for cross-references
#   title         position title
#   institution   organization name
#   unit          department/school/center (optional)
#   start / end   YYYY-MM ("present" appointments use end: null)
#   is_primary_current  true for the one appointment that is the "main job" today
#                 (validation enforces exactly one true among open appointments
#                 unless is_primary_current is explicitly set on more than one
#                 with allow_multiple_primary: true at the list level)
#   bullets       CV-style accomplishment bullets (used only in CV; long-form)
#   ospo          optional structured sub-record for an effort-split arrangement
#                 connected to this appointment (not a separate appointment)

allow_multiple_primary_current: false

appointments:
  - id: gt-research-scientist-ii
    title: Research Scientist II
    institution: Georgia Institute of Technology
    unit: School of Earth and Atmospheric Sciences
    start: "2026-09"
    end: null
    is_primary_current: true
    previous_role_note: "Postdoctoral Research Fellow — Computational Science and Scientific Software, Aug. 2024–Aug. 2026."
    bullets:
      - "Design and develop ICESEE, an open-source, MPI-parallel ensemble data assimilation framework for state and parameter estimation in ice-sheet and geophysical models."
      - "Develop scalable model-coupling interfaces and workflows for integrating ICESEE with independent scientific models, including ISSM and Icepack."
      - "Parallelize and optimize ensemble simulation and data assimilation workflows for distributed-memory HPC systems using MPI and scalable scientific computing methods."
      - "Design and develop <a href=\"https://cryostack.eas.gatech.edu/\">CryoStack</a>, a modular scientific cyberinfrastructure platform connecting cryosphere data, models, data assimilation, and heterogeneous computing environments through CryoLauncher, ICESEE, Frozen Legacies, and LIVIST."
      - "Develop Remote and AWS cloud execution capabilities for scientific workflows, including containerized execution on AWS Fargate and EC2 and integration with institutional computing resources."
      - "Develop reproducible scientific software environments using Docker, Apptainer, Spack, and HPC deployment workflows."
      - "Develop Python–MATLAB interoperability and ISSM–ICESEE coupling workflows for ensemble forecasting, parameter estimation, and data assimilation."
      - "Develop workflow automation for experiment configuration, provenance, simulation diagnostics, HPC job orchestration, and scientific result management."
      - "Contribute to research on scalable data assimilation and computational methods for understanding ice-sheet dynamics and their contribution to future sea-level change."
    # LaTeX/PDF CV historically used a shorter, CryoStack-application-agnostic
    # bullet here; the web CV/site already describe the four applications.
    # Canonical data uses the fuller, current description everywhere.
    ospo:
      program: OSPO@GT
      role_title: Research Software Engineer
      role_start: "2026-09"
      current_description: "Since September 2026, I have also worked as a Research Software Engineer with Georgia Tech’s Open Source Program Office (OSPO), as part of my Georgia Tech appointment alongside EAS research. From October through December 2026, OSPO supports 30% of this appointment’s effort."
      # Role and September start confirmed by Brian on 26 October 2026.
      # The 30% October–December allocation remains part of the same GT appointment.
      cv_description: '<strong>Research Software Engineer, OSPO@GT (since September 2026; part-time, 30% FTE allocation October–December 2026).</strong><br>Contribute to open-source AI platform development for Georgia Tech educators under Dr. Fang (Cherry) Liu, including GT-DARE deployment, operational documentation, and access/onboarding workflow development. This work is part of my Georgia Tech appointment alongside EAS research.'
      full_name: Georgia Tech Open Source Program Office
      effort_pct: 30
      start: "2026-10"
      end: "2026-12"
      # Shared verbatim continuation clause (identical on talks page + CV) --
      # kept as an explicit fact rather than re-derived, since it is quoted
      # unchanged in both prose contexts below.
      continuation_clause: "the remaining effort will continue with EAS/CryoStack development"
      tense: current
      # Structured list, used for the ORCID checklist (rendered as bullets,
      # order preserved). The talks-page and CV paragraphs below are each
      # their own hand-tuned prose rendering of these same facts (irregular
      # English conjunctions -- "and, as time allows," -- don't survive a
      # generic list-join, so they are kept as curated sentences here rather
      # than mechanically generated).
      activities:
        - "Contributing to DARE, including AI-facing development"
        - "Work with open scientific datasets and Hugging Face"
        - "Mentoring student contributors on open-source projects, including AI- and security-focused work"
        - "Maintainer activities and monthly meetings"
        - "Hackathons and workshops"
        - "Open-source websites, repositories, accounts, and supporting infrastructure"
        - "Training resources, as time allows"
      talks_activities_sentence: "Planned responsibilities include contributing to DARE, including AI-facing development; work with open scientific datasets and Hugging Face; mentoring student contributors on open-source projects, including AI- and security-focused work; maintainer activities and monthly meetings; hackathons and workshops; open-source websites, repositories, accounts, and supporting infrastructure; and, as time allows, training resources."
      cv_activities_sentence: "Planned work includes DARE and AI-facing development, open datasets and Hugging Face, student mentoring, maintainer activities, and open-source infrastructure and events."

