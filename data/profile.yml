research_identity_summary: >-
  I work across scientific computing, computational mathematics, numerical
  modeling, data assimilation, and machine learning, developing research
  software and cyberinfrastructure for cryosphere and Earth-system
  applications on HPC and cloud platforms.

professional_summary: >-
  Computational scientist and scientific software developer specializing in
  high-performance scientific computing, numerical modeling, data
  assimilation, and scalable research software. My work focuses on
  developing reliable, reproducible, and interoperable computational systems
  for large-scale scientific applications. I have experience developing
  open-source scientific software, MPI- and GPU-based workflows, HPC and
  cloud computing platforms, containerized environments, and coupled
  modeling systems across Python, MATLAB, and compiled scientific codes.

