# Canonical talks/posters/conferences records.
# Edit this file when: you give a talk, present a poster, or attend/organize
# a conference or short course.
#
# Each item is stored as a single pre-rendered `html` fragment (the exact
# wording already used on the site/CV) rather than decomposed into rigid
# title/venue/date fields, because the original phrasing mixes venue-first,
# title-first, and date-suffixed forms inconsistently by design (it mirrors
# how each event is actually cited). Order in this file is the display order
# -- do not reorder without meaning to change the rendered list. Both the
# talks page and the CV render the *same* three lists below verbatim.

